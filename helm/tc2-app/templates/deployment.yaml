apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tc2-app.fullname" . }}
  labels:
    {{- include "tc2-app.labels" . | nindent 4 }}

spec:
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      {{- include "tc2-app.selectorLabels" . | nindent 6 }}

  template:
    metadata:
      labels:
        {{- include "tc2-app.labels" . | nindent 8 }}

    spec:
      serviceAccountName: {{ include "tc2-app.serviceAccountName" . }}

      containers:
        - name: {{ .Chart.Name }}

          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}

          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}